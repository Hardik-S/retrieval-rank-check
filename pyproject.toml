[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "retrieval-rank-check"
version = "0.1.0"
description = "Offline strict JSONL retrieval-rank fixture validator"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Hardik-S"}]
dependencies = []

[project.scripts]
retrieval-rank-check = "retrieval_rank_check.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
